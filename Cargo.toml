[package]
edition = "2021"
name = "dao_monitor"
version = "0.1.0"

[dependencies]
odra = { version = "2.8.2", features = [], default-features = false }

[dev-dependencies]
odra-test = { version = "2.8.2", default-features = true }

[build-dependencies]
odra-build = { version = "2.8.2", features = [], default-features = false }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
odra-build = { version = "2.8.2", features = [], default-features = false }
odra-cli = { version = "2.8.2", features = [], default-features = false }
odra-casper-livenet-env = { version = "2.8.2", optional = true }
env_logger = "0.11"

[features]
default = []
livenet = ["odra-casper-livenet-env"]

[dependencies.indexmap]
version = "1.9.3"
features = ["std"]

[[bin]]
name = "dao_monitor_build_contract"
path = "bin/build_contract.rs"
test = false

[[bin]]
name = "dao_monitor_build_schema"
path = "bin/build_schema.rs"
test = false

[[bin]]
name = "dao_monitor_cli"
path = "bin/cli.rs"
test = false

[[bin]]
name = "deploy"
path = "bin/deploy.rs"
test = false
required-features = ["livenet"]

[profile.release]
codegen-units = 1
lto = true

[profile.dev.package."*"]
opt-level = 3